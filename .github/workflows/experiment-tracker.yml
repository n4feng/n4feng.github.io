name: Experiment tracker checks

on:
  pull_request:
    paths:
      - 'experiment-tracker/**'
      - 'experiments/**'
      - '.github/workflows/experiment-tracker.yml'
  push:
    branches: [master]
    paths:
      - 'experiment-tracker/**'
      - 'experiments/**'
      - '.github/workflows/experiment-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiment-tracker/frontend/package-lock.json
      - name: Install server and verification dependencies
        run: python -m pip install -r experiment-tracker/server/requirements-dev.txt
      - name: Test SQLite, DynamoDB, and Lambda request handling
        working-directory: experiment-tracker/server
        run: python -m unittest discover -s tests -v
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Validate SAM and CloudFormation resources
        run: cfn-lint --template experiment-tracker/template.yaml --regions us-east-1
      - name: Install frontend dependencies
        working-directory: experiment-tracker/frontend
        run: npm ci
      - name: Test plot options validation and saving
        working-directory: experiment-tracker/frontend
        run: npm test
      - name: Build React
        working-directory: experiment-tracker/frontend
        run: npm run build
      - name: Check committed Pages assets are current
        run: |
          git diff --exit-code -- experiments/
          test -z "$(git ls-files --others --exclude-standard experiments/)"
