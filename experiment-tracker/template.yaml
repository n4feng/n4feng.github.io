AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Experiment tracker Flask API with Lambda HTTPS and DynamoDB storage.

Parameters:
  RootAccessCode:
    Type: String
    Default: '666666'
    NoEcho: true
    MinLength: 6
    MaxLength: 128
    Description: Shared read/write access code; change the public default for private data.
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    Description: Random signing key generated by deploy_aws.py; keep unchanged on updates.
  CorsOrigins:
    Type: String
    Default: https://n4feng.github.io
    Description: Comma-separated exact frontend origins, without URL paths.
  ReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    MaxValue: 20
    Description: '-1 leaves account concurrency unreserved; 0 pauses requests; positive values bound simultaneous executions, not cost.'

Conditions:
  LimitConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]

Resources:
  ExperimentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # TTL applies only to unpublished plot chunks. Published experiment data
      # has no expiry; authentication and sessions never enter this table.

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExperimentDataOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt ExperimentTable.Arn
                # DynamoDB transaction requests are authorized against their
                # individual item operations, not a TransactWriteItems action.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: server/
      Handler: lambda_handler.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ApiRole.Arn
      ReservedConcurrentExecutions: !If [LimitConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          STORAGE_BACKEND: dynamodb
          DYNAMODB_TABLE: !Ref ExperimentTable
          ROOT_ACCESS_CODE: !Ref RootAccessCode
          SECRET_KEY: !Ref SessionSecret
          CORS_ORIGINS: !Ref CorsOrigins

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      # Flask supplies CORS headers and protects data endpoints. Defining CORS
      # in both places produces duplicate browser-rejected headers.

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ApiUrlInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: HTTPS API origin; append api/health or enter this URL in the frontend.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Description: Retained DynamoDB table containing experiment data.
    Value: !Ref ExperimentTable
  FunctionName:
    Value: !Ref ApiFunction
  LogGroupName:
    Value: !Ref ApiLogGroup
